<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards - Admin</title>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container-fluid py-4">
        <header class="d-flex justify-content-between align-items-center mb-4 px-2">
            <h1>Admin Dashboard</h1>
            <button class="btn btn-primary" id="add-card-btn">Add New Card</button>
        </header>

        <main>
            <table class="table table-hover align-middle mb-0" id="cards-table">
                <thead>
                    <tr>
                        <th style="width: 100px;">Image</th>
                        <th>Kanji</th>
                        <th>Reading</th>
                        <th>Meaning</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Content via JS -->
                </tbody>
            </table>
        </main>
    </div>

    <!-- Modal for Edit/Add -->
    <div class="modal fade" id="cardModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Edit Card</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="card-form">
                        <input type="hidden" id="card-id">
                        <div class="row g-3">
                            <div class="col-12">
                                <div class="form-check form-switch bg-dark p-3 rounded border border-secondary">
                                    <input class="form-check-input ms-0 me-2" type="checkbox" id="form-hidden">
                                    <label class="form-check-label" for="form-hidden">Hidden (Exclude from study sessions)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Kanji</label>
                                <input type="text" class="form-control" id="form-kanji" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Reading</label>
                                <input type="text" class="form-control" id="form-reading" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-secondary small">Meaning</label>
                                <input type="text" class="form-control" id="form-meaning" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label text-secondary small">Sentence (Japanese)</label>
                                <input type="text" class="form-control" id="form-sentence">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-secondary small">English Sentence</label>
                                <input type="text" class="form-control" id="form-englishSentence">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Image Asset</label>
                                <div id="image-drop-zone" class="drop-zone p-3 border rounded text-center">
                                    <p class="mb-0 small text-secondary">Drag image, paste (Ctrl+V), or click</p>
                                    <input type="file" id="image-input" hidden accept="image/*">
                                    <img id="image-preview" class="img-thumbnail mt-2 d-none" style="max-height: 150px;">
                                    <input type="hidden" id="form-image">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small">Audio Asset</label>
                                <div class="input-group input-group-sm mb-2">
                                    <input type="file" class="form-control" id="audio-input" accept="audio/*">
                                    <input type="text" class="form-control" id="form-audio-url" placeholder="or paste URL">
                                    <button type="button" class="btn btn-outline-secondary" id="tts-audio-btn">TTS</button>
                                </div>
                                <input type="hidden" id="form-audio">
                                
                                <label class="form-label text-secondary small">Sentence Audio</label>
                                <div class="input-group input-group-sm">
                                    <input type="file" class="form-control" id="sentence-audio-input" accept="audio/*">
                                    <input type="text" class="form-control" id="form-sentenceAudio-url" placeholder="or paste URL">
                                    <button type="button" class="btn btn-outline-secondary" id="tts-sentenceAudio-btn">TTS</button>
                                </div>
                                <input type="hidden" id="form-sentenceAudio">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary px-4" id="save-card-btn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>

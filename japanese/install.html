<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initializing Japanese Study App...</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8f9fa; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #launch-btn { display: none; margin-top: 20px; padding: 10px 20px; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2 id="status">Caching assets...</h2>
    <button id="launch-btn" onclick="window.location.href='index.html'">Launch App</button>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                reg.addEventListener('updatefound', () => {
                    const worker = reg.installing;
                    worker.addEventListener('statechange', () => {
                        if (worker.state === 'activated') {
                            document.getElementById('status').textContent = 'App Ready!';
                            document.getElementById('launch-btn').style.display = 'block';
                            document.querySelector('.spinner').style.display = 'none';
                        }
                    });
                });
            });
        } else {
            document.getElementById('status').textContent = 'Service Workers not supported.';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        };
        console.log('v1.0')
    </script>
    <!-- Home Section -->
    <section id="home-section">
        <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Cards</a>
                <div class="d-flex align-items-center">
                    <div class="form-check form-switch me-3">
                        <input class="form-check-input" type="checkbox" id="randomize-toggle">
                        <label class="form-check-label small" for="randomize-toggle">Randomize</label>
                    </div>
                    <button class="btn btn-outline-danger btn-sm me-2" id="dev-reset" title="Reset Storage & Cache">
                        Reset
                    </button>
                    <button class="btn btn-outline-secondary me-2" id="theme-toggle">

                        <span id="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
        </nav>

        <main class="container">
            <div id="cards-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <!-- Cards will be rendered here -->
            </div>
        </main>
    </section>

    <!-- Full-Screen Study View (Hidden by default) -->
    <section id="card-view-section" class="d-none">
        <div id="full-card-wrapper">
            <!-- Navigation buttons -->
            <button id="back-to-home" class="btn btn-light position-absolute top-0 start-0 m-3 z-3 shadow-sm rounded-circle" title="Close">&times;</button>
            
            <button id="prev-card" class="nav-btn" style="left: 0;">&larr;</button>
            <button id="next-card" class="nav-btn" style="right: 0;">&rarr;</button>

            <div id="study-container">
                <!-- Content via JS -->
            </div>
        </div>
    </section>

    <div id="notification-container" class="toast-container position-fixed bottom-0 end-0 p-3">
        <!-- Notifications will be rendered here -->
    </div>

    <div id="notification-container" class="toast-container position-fixed bottom-0 end-0 p-3">
        <!-- Notifications will be rendered here -->
    </div>

    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda X</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="A curated selection of premium goods.">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <h1>Tienda X</h1>
            <div class="header-actions">
                <a href="#" id="contact-btn" class="icon-btn" aria-label="Contact">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                        </path>
                    </svg>
                </a>
                <button id="cart-btn" class="icon-btn" aria-label="Cart">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span id="cart-count" class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="product-grid" class="product-grid">
            <!-- Products will be injected here -->
            <div class="loading">Loading collection...</div>
        </div>
    </main>

    <!-- Cart Modal (Floating) -->
    <div id="cart-modal" class="floating-panel">
        <div class="panel-header">
            <h2>Tu Carrito</h2>
            <button id="close-cart" class="close-panel">&times;</button>
        </div>
        <div id="cart-items" class="panel-content">
            <div id="empty-cart-message" class="empty-cart-message">No hay nada en tu carrito</div>
        </div>
        <div class="panel-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <a href="#" id="checkout-btn" class="checkout-btn">Finalizar Compra por WhatsApp</a>
            <button id="continue-shopping-btn" class="continue-shopping-btn">Seguir Comprando</button>
        </div>
    </div>

    <!-- Product Detail Modal (Floating) -->
    <div id="product-detail-modal" class="floating-panel">
        <div class="panel-header">
            <h2 id="detail-title">Título del Producto</h2>
            <button id="close-detail" class="close-panel">&times;</button>
        </div>
        <div class="panel-content">
            <div class="detail-image-container">
                <img id="detail-image" src="" alt="Producto" class="detail-image">
            </div>
            <p id="detail-price" class="detail-price">$0.00</p>
            <p id="detail-description" class="detail-description">La descripción va aquí...</p>
            <div id="detail-features-container"></div>

            <div class="detail-actions">
                <div class="quantity-controls big">
                    <button class="qty-btn" id="detail-minus">-</button>
                    <span class="qty-val" id="detail-qty">1</span>
                    <button class="qty-btn" id="detail-plus">+</button>
                </div>
                <div class="action-buttons">
                    <a href="#" id="detail-buy-now" class="btn-primary">Pedir 1 ahora</a>
                    <button id="detail-add-cart" class="btn-secondary">Agregar al Carrito</button>
                </div>
            </div>
        </div>
        <div id="scroll-indicator" class="scroll-indicator">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 Premium Catalog</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="products.js"></script>
    <script src="app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
            console.log('sw.js enabled')
        } 
    </script>
    <!-- Home Section -->
    <section id="home-section">
        <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Cards</a>
                <div class="dropdown">
                    <button class="settings-btn me-3" type="button" id="btn-statistics-top" title="Statistics">
                        📊
                    </button>
                    <button class="settings-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Settings">
                        ⚙️
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end p-3" style="min-width: 200px;">
                        <li class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="randomize-toggle">
                                <label class="form-check-label" for="randomize-toggle">Randomize</label>
                            </div>
                        </li>
                        <li class="mb-3">
                            <button class="btn btn-outline-secondary w-100 d-flex justify-content-between align-items-center" id="theme-toggle">
                                <span>Theme</span>
                                <span id="theme-icon">🌙</span>
                            </button>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button class="btn btn-outline-danger w-100" id="dev-reset" title="Full Reset">
                                Full Reset
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container">
            <!-- Dashboard View -->
            <div id="dashboard-view" class="view-section">
                <div class="list-group list-group-flush">
                    <div class="list-group-item d-flex align-items-center py-3 px-0 border-bottom" id="btn-all-cards" style="cursor: pointer;">
                        <div class="flex-grow-1">
                            <div class="fw-bold">All Cards</div>
                            <div class="small text-muted">Review and study all vocabulary cards.</div>
                        </div>
                        <div class="fs-4 ms-3">🗂️</div>
                    </div>
                    <div class="list-group-item d-flex align-items-center py-3 px-0 border-bottom" id="btn-meaning-game" style="cursor: pointer;">
                        <div class="flex-grow-1">
                            <div class="fw-bold">Meaning Match</div>
                            <div class="small text-muted">Test your knowledge of Kanji meanings.</div>
                        </div>
                        <div class="fs-4 ms-3">🧠</div>
                    </div>
                    <div class="list-group-item d-flex align-items-center py-3 px-0 border-bottom" id="btn-listening-game" style="cursor: pointer;">
                        <div class="flex-grow-1">
                            <div class="fw-bold">Listening Practice</div>
                            <div class="small text-muted">Identify words from audio clips.</div>
                        </div>
                        <div class="fs-4 ms-3">🎧</div>
                    </div>
                    <div class="list-group-item d-flex align-items-center py-3 px-0 border-bottom" id="btn-new-game" style="cursor: pointer;">
                        <div class="flex-grow-1">
                            <div class="fw-bold">New Game (Coming Soon)</div>
                            <div class="small text-muted">Another way to practice Japanese.</div>
                        </div>
                        <div class="fs-4 ms-3">✨</div>
                    </div>
                </div>
            </div>

            <!-- All Cards View -->
            <div id="all-cards-view" class="view-section d-none">
                <div class="d-flex align-items-center mb-4">
                    <button class="btn btn-outline-secondary back-btn me-3" id="back-to-dashboard-cards" title="Back to Dashboard">
                        ←
                    </button>
                    <h2 class="mb-0">All Cards</h2>
                </div>
                <div id="cards-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                    <!-- Cards will be rendered here -->
                </div>
            </div>

            <!-- Meaning Game View -->
            <div id="meaning-game-view" class="view-section d-none">
                <div class="d-flex align-items-center mb-2">
                    <button class="btn btn-outline-secondary back-btn me-3" id="back-to-dashboard-meaning" title="Back to Dashboard">
                        ←
                    </button>
                </div>
                <div id="meaning-game-container" class="game-container">
                    <!-- Game content via JS -->
                </div>
            </div>

            <!-- Listening Game View -->
            <div id="listening-game-view" class="view-section d-none">
                <div class="d-flex align-items-center mb-2">
                    <button class="btn btn-outline-secondary back-btn me-3" id="back-to-dashboard-listening" title="Back to Dashboard">
                        ←
                    </button>
                </div>
                <div id="listening-game-container" class="game-container">
                    <!-- Game content via JS -->
                </div>
            </div>

            <!-- Statistics View -->
            <div id="statistics-view" class="view-section d-none">
                <div class="d-flex align-items-center mb-4">
                    <button class="btn btn-outline-secondary back-btn me-3" id="back-to-dashboard-stats" title="Back to Dashboard">
                        ←
                    </button>
                    <h2 class="mb-0">Statistics</h2>
                </div>
                <div id="statistics-container" class="container pb-4">
                    <!-- Stats content via JS -->
                </div>
            </div>
        </main>

        <footer id="footer">Santael - v1.0</footer>
    </section>

    <!-- Full-Screen Study View (Hidden by default) -->
    <section id="card-view-section" class="d-none">
        <div id="full-card-wrapper">
            <!-- Navigation buttons -->
            <button id="back-to-home" class="btn btn-light position-absolute top-0 start-0 m-3 z-3 shadow-sm rounded-circle" title="Close">&times;</button>
            
            <button id="prev-card" class="nav-btn" style="left: 0;">&larr;</button>
            <button id="next-card" class="nav-btn" style="right: 0;">&rarr;</button>

            <div id="study-container">
                <!-- Content via JS -->
            </div>
        </div>
    </section>

    <div id="notification-container" class="toast-container position-fixed bottom-0 end-0 p-3">
        <!-- Notifications will be rendered here -->
    </div>

    <div id="notification-container" class="toast-container position-fixed bottom-0 end-0 p-3">
        <!-- Notifications will be rendered here -->
    </div>

    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>

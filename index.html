<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>stop</title>
    <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 10px;
    }
  </style>
</head>
<body> 
  <input id="input" type="text" />
  <br />
  <button type="button" onclick="accept()">ok</button>
    <script>
    let input = document.getElementById('input');
    console.log(input);
    function accept() {
      if (input.value === '693') {
        try {
          window.location ='/page.html';
        } catch (error) {
          input.value = '';
          input.focus();
          console.log(error);
        }
        window.location ='/page.html';
      }
      else {
        input.value = '';
        input.focus();
      }
    }
  </script>
</body>
</html>

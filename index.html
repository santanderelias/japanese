<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>stop</title>
    <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
  <script>
    let input = document.getElementById('input');
    function accept() {
      if (input.value === '693') {
        window.location ='/page.html';
      }
      else {
        input.value = '';
        input.focus();
      }
    }
  </script>
</head>
<body> 
  <label for="input">Text input field:</label>
  <input id="input" type="text" />
  <br />
  <button type="button" onclick="accept()">ok</button>
</body>
</html>

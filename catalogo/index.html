<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo!</title>
    <meta name="description" content="Catalogo de cosas.">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo">CATALOGO</div>
            <button id="nav-back" class="nav-back-btn hidden" aria-label="Volver">Volver</button>
        </div>
        <div class="nav-right">
            <a href="https://wa.me/5491153892491" target="_blank" class="nav-contact-btn" id="contact-btn">📞</a>
            <button id="menu-toggle" class="menu-btn" aria-label="Open Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </nav>

    <!-- Side Menu -->
    <div id="side-menu" class="side-menu">
        <div class="menu-overlay"></div>
        <div class="menu-content">
            <button id="menu-close" class="close-btn">&times;</button>
            <nav class="menu-nav">
                <a href="#" class="menu-item active" data-section="home-section">Inicio</a>
                <a href="#" class="menu-item" data-section="section-1">Sección 1</a>
                <a href="#" class="menu-item" data-section="section-2">Sección 2</a>

                <a href="#" class="menu-item" data-section="section-4">Sección 4</a>
            </nav>
        </div>
    </div>

    <main id="app-container">
        <!-- Home Section -->
        <section id="home-section" class="active">
            <div class="catalog-grid">
                <div class="catalog-item" data-section="section-1" style="--bg-image: url('img/section1/01.webp');">
                    <div class="item-overlay">
                        <h3>Titulo 1</h3>
                        <p>Descripcion numero 1</p>
                    </div>
                </div>
                <div class="catalog-item" data-section="section-2" style="--bg-image: url('img/section2/04.jpeg');">
                    <div class="item-overlay">
                        <h3>Titulo seccion 2</h3>
                        <p>Descripcion seccion numero 2</p>
                    </div>
                </div>
                <div class="catalog-item" data-section="section-3" style="--bg-image: url('img/section3/07.jpeg');">
                    <div class="item-overlay">
                        <h3>Titulo seccion 3</h3>
                        <p>Descripcion numero 3</p>
                    </div>
                </div>
                <div class="catalog-item" data-section="section-4" style="--bg-image: url('img/section4/04.jpeg');">
                    <div class="item-overlay">
                        <h3>Ultima seccion</h3>
                        <p>Descripcion de la ultima seccion</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Product Sections -->
        <section id="section-1" class="content-section">
            <div class="section-content">
                <div class="gallery-grid" id="gallery-1">
                    <!-- Images will be populated by JS or static list -->
                    <div class="gallery-item"><img src="img/section1/01.webp"></div>
                    <div class="gallery-item"><img src="img/section1/02.jpeg"></div>

                    <div class="gallery-item"><img src="img/section1/04.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/05.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/06.jpg"></div>
                    <div class="gallery-item"><img src="img/section1/07.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/08.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/09.jpg"></div>
                </div>
            </div>
        </section>

        <section id="section-2" class="content-section">
            <div class="section-content">
                <div class="gallery-grid" id="gallery-2">
                    <div class="gallery-item"><img src="img/section1/01.webp"></div>
                    <div class="gallery-item"><img src="img/section1/02.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/03.webp"></div>

                    <div class="gallery-item"><img src="img/section1/06.jpg"></div>
                    <div class="gallery-item"><img src="img/section1/07.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/08.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/09.jpg"></div>

                <div class="gallery-grid" id="gallery-3">
                    <div class="gallery-item"><img src="img/section1/01.webp"></div>
                    <div class="gallery-item"><img src="img/section1/02.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/03.webp"></div>
                    <div class="gallery-item"><img src="img/section1/04.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/05.jpeg"></div>

                <div class="gallery-grid" id="gallery-4">
                    <div class="gallery-item"><img src="img/section1/01.webp"></div>
                    <div class="gallery-item"><img src="img/section1/02.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/03.webp"></div>
                    <div class="gallery-item"><img src="img/section1/04.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/05.jpeg"></div>
                    <div class="gallery-item"><img src="img/section1/06.jpg"></div>

        <div class="lightbox-overlay"></div>
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <button class="lightbox-nav prev" aria-label="Anterior">&#10094;</button>

        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Galllery Image">

    <footer class="main-footer">
        <p>&copy; 2026 Catalogo. Elias Santander.</p>
